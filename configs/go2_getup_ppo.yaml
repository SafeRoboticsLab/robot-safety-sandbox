# E083 (T006) — CERTIFIED TRANSITION: GET-UP funnel RA_rest→stand, HIGH-CoM (inverted-pendulum load,
# LOAD_HEIGHT=0.25). Go2 spawned PRONE under a carried load W∈[0,160]N; g=universal no-slam (<80+1.3W N),
# l=FULL stance target — get up to a stable stand despite the load torque + adversary. Trains V_rest→stand.
# The genuine batch-2 gap (nothing else trains a loaded get-up); the hardest task in the campaign.
# Same tuned two-player safety-PPO recipe as the E073 weight arms (ReachAvoidPPO2P; entropy in the LOSS,
# not the value target); only the task (prone spawns + objective) differs.
#   python examples/train.py --config configs/go2_getup_ppo.yaml
family: on_policy          # PPO family
task: go2_getup
adversary: true            # -> ReachAvoidPPO2P (two-player)
num_envs: 1024
steps: 50000000
seed: 0
out: results/go2_transition_runs
wandb_project: odd-conditioned

# --- safety-PPO recipe (from go2_weak_leg_blind_soft_dyn) ---
lr: 1.0e-4
adaptive_lr: false         # fixed LR for the sparse safety signal
target_kl: 0.01            # KL early-stop
ent_coef: 1.0e-3
max_std: 0.4               # cap action std (prevents entropy runaway)
net: "128,128,128"
terminal_type: all         # terminal valued as min(l,g) — correct reach-avoid anchor

# smaller adversarial force range (peak 25N) so the loaded task is winnable; identical across all arms.
force_max: 25.0
