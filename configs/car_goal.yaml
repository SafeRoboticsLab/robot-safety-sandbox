# Car-goal reach-avoid (ReachAvoidPPO1P) — the tutorial recipe.
#   python examples/train.py --config configs/car_goal.yaml
#
# E064: this reproduces the SUCCESSFUL 2026-07-19 run (wandb commit c53d8a2f),
# whose recipe had drifted because car_goal.yaml was uncommitted at the time.
# The load-bearing element is the GAMMA ANNEAL (StepGammaAnneal 0.99->0.999@20%
# ->0.9999@40%): it was ON by default on 7/19, later flipped OFF on the PPO
# path, which is what broke reaching. adaptive_lr was ON in the win too.
family: on_policy        # PPO family — the train.py router reads this
task: car_goal
num_envs: 1024
steps: 25000000
seed: 0
net: "256,256"          # small net: the obs is low-dim (car state + goal + 2 obstacles)
ent_coef: 0.003         # a little exploration to find the goal past the obstacles
lr: 0.0005              # winning run: 5e-4 (KL-adaptive from here)
adaptive_lr: true       # winning run: KL-adaptive ON (desired_kl 0.01, x1.5/update)
gamma: 0.99             # base discount; the anneal carries it to 0.9999
gamma_anneal: true      # winning run: StepGammaAnneal(0.99->0.9999). LOAD-BEARING.
# no end_criterion / terminal_type override -> defaults (None / "all"), matching
# the winning run (end_criterion: null, terminal_type: all).
video_interval: 2000000 # a training clip to wandb every ~2M steps
