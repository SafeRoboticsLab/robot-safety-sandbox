# LEG-DEGRADATION ODD — CONDITIONED arm. Go2 with the FR leg's allowable torque θ ∈ [0.2, 1.0] RANDOMIZED
# per-episode AND θ EXPOSED to the actor+critic (the oracle that can adapt strategy per-θ). Identical env
# to the blind arm; the ONLY difference is θ appended to the obs. Same tuned two-player safety-PPO recipe:
# ReachAvoidPPO2P (alternating best-response; entropy in the LOSS, not the value target).
#   python examples/train.py --config configs/go2_weak_leg_conditioned_ppo.yaml
family: on_policy          # PPO family
task: go2_weak_leg_conditioned
adversary: true            # -> ReachAvoidPPO2P (two-player)
num_envs: 1024
steps: 50000000
seed: 0
out: results/go2_weak_leg_runs
wandb_project: odd-conditioned

# --- safety-PPO recipe (from go2_stabilize_reachavoidppo1p) ---
lr: 1.0e-4
adaptive_lr: false         # fixed LR for the sparse safety signal
target_kl: 0.01            # KL early-stop
ent_coef: 1.0e-3
max_std: 0.4               # cap action std (prevents entropy runaway)
net: "128,128,128"
terminal_type: all         # terminal valued as min(l,g) — correct reach-avoid anchor

# E047 — smaller adversarial force range (peak 50->25N) so the weak-leg task is winnable; identical to the
# blind + history arms so the adversary is the same and only the obs surface (θ exposed) differs.
force_max: 25.0
