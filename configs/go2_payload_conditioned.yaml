# E015 CONDITIONED arm — two-player reach-avoid SAC (GameplaySAC) on go2_payload_conditioned.
# ODD (rigidity x total-mass) randomized PER-EPISODE; theta EXPOSED to actor+critic. One policy that
# adapts strategy per-ODD (dodge light-rigid / brace heavy-sloshy). Blind twin: go2_payload_blind.yaml.
#   python examples/train.py --config configs/go2_payload_conditioned.yaml
family: off_policy           # SAC family — the train.py router reads this
task: go2_payload_conditioned
adversary: true              # -> GameplaySAC (2-player reach-avoid)
num_envs: 512                # E014-specialist recipe (R = grad_steps*batch/num_envs = 32)
steps: 20000000
seed: 0
out: results/go2_payload_runs
wandb_project: odd-conditioned

# --- SAC hypers (reference-faithful, matches the E014 specialists) ---
lr: 1.0e-4
tau: 0.01
target_update_interval: 2
ent_coef: auto_0.1           # learned entropy temperature, init 0.1
buffer_size: 1000000
batch_size: 4096
gradient_steps: 4

# --- discount annealing (reference discrete jumps) ---
gamma_schedule: step         # 0.99 -> 0.999 @20% -> 0.9999 @40%, hold; resets alpha per jump
gamma_init: 0.99
gamma_end: 0.9999
min_alpha: 0.001

# --- fast leaderboard (tensor eval env; the throughput fix) + safe-rate eval ---
leaderboard_freq: 2000000
leaderboard_episodes: 3
eval_rollouts: 100
eval_freq: 2000000
