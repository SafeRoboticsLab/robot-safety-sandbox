# LEG-FAMILY STAND mode. Go2 with a per-episode FR-leg torque fraction θ∈[0.5,1.0]
# (the comfortably-feasible stance band), θ EXPOSED to actor+critic. Target = stance_margins (hold a stable
# stand despite the weak leg + the adversarial pull). Trains V_leg_stand(x, θ) — the strong-mode certificate
# for the leg-degradation ladder. Tuned two-player safety-PPO recipe:
# ReachAvoidPPO2P (alternating best-response; entropy in the LOSS, not the value target).
#   python examples/train.py --config configs/go2_leg_stand_ppo.yaml
family: on_policy          # PPO family
task: go2_leg_stand
adversary: true            # -> ReachAvoidPPO2P (two-player)
num_envs: 1024
steps: 50000000
seed: 0
out: runs
wandb_project: odd-conditioned

# --- safety-PPO recipe ---
lr: 1.0e-4
adaptive_lr: false         # fixed LR for the sparse safety signal
target_kl: 0.01            # KL early-stop
ent_coef: 1.0e-3
max_std: 0.4               # cap action std (prevents entropy runaway)
net: "128,128,128"
terminal_type: all         # terminal valued as min(l,g) — correct reach-avoid anchor

# smaller adversarial force range (peak 25N) so the weak-leg task is winnable; identical to the REST arm so
# only the objective (stance vs soft-rest) and the θ range differ.
force_max: 25.0
