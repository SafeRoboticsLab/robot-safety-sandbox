# ReachAvoidSAC1P on digit_stabilize: M=ReachAvoid (the task's mode), A=SAC
# (family: off_policy), P=1P (no adversary). Single-player reach-avoid SAC to test
# whether safety_sb3 v0.4.0's entropy-soundness fix (entropy bonus removed from the
# AVOID/REACH_AVOID SAC critic target) + the min_alpha-now-applies-to-RA-1P fix yield a
# better standing-pose reach-avoid policy than our (all-PPO) E026-E032 attempts.
# Mirrors configs/go2_stabilize_reachavoidsac2p.yaml minus the adversary. ctrl_gain=12
# and ctrl_dim=20 come from the task's TaskSpec kwargs (auto-forwarded by make_tensor).
#   source activate.sh
#   python external/robot_safety_sandbox/examples/train.py \
#     --config external/robot_safety_sandbox/configs/digit_stabilize_reachavoidsac1p.yaml
family: off_policy       # SAC family — the train.py router reads this
task: digit_stabilize        # mode=reach-avoid, 1P (no adversary) -> ReachAvoidSAC1P
num_envs: 1024
steps: 100000000
seed: 0

# --- SAC hypers (reference: go2_stabilize RA-SAC) ---
lr: 1.0e-4
tau: 0.01
target_update_interval: 2
ent_coef: auto_0.1           # learned entropy temperature, init 0.1
buffer_size: 1000000
batch_size: 4096
gradient_steps: 4

# --- discount annealing (reference-faithful discrete jumps; the v0.4.0 fix keeps the
#     entropy bonus OUT of the RA critic target, so the {V>=0} certificate stays sound
#     across the 0.99->0.9999 anneal where it used to drift O(margin)) ---
gamma_schedule: step         # 0.99 -> 0.999 @20% -> 0.9999 @40%, hold; resets alpha per jump
gamma_init: 0.99
gamma_end: 0.9999
min_alpha: 0.001             # entropy-temperature floor (v0.4.0: now actually applied to RA-1P)

# --- safe/success-rate eval to wandb ---
eval_rollouts: 100
eval_freq: 2000000
