# E070 (T003, plan G2) — WEIGHT-LADDER REST mode. Go2 carrying a per-episode downward load W∈[0,300]N
# (heavier range, spanning loads where standing is infeasible), W EXPOSED to actor+critic. Target =
# weight_rest_margins: come down softly to a LOW LEVEL belly rest WITHOUT slamming, with a LOAD-CONDITIONED
# slam cap SLAM_CAP(W)=80+1.3W N (a heavier payload rests heavier). illegal_contact raised to 500N so a
# belly rest under load does not terminate — the reach-avoid g does the safety scoring. Trains V_rest(x, W)
# — the weak-mode certificate. Same tuned two-player safety-PPO recipe: ReachAvoidPPO2P.
#   python examples/train.py --config configs/go2_weight_rest_ppo.yaml
family: on_policy          # PPO family
task: go2_weight_rest
adversary: true            # -> ReachAvoidPPO2P (two-player)
num_envs: 1024
steps: 50000000
seed: 0
out: results/go2_weight_runs
wandb_project: odd-conditioned

# --- safety-PPO recipe (from go2_weak_leg_blind_soft_dyn) ---
lr: 1.0e-4
adaptive_lr: false         # fixed LR for the sparse safety signal
target_kl: 0.01            # KL early-stop
ent_coef: 1.0e-3
max_std: 0.4               # cap action std (prevents entropy runaway)
net: "128,128,128"
terminal_type: all         # terminal valued as min(l,g) — correct reach-avoid anchor

# smaller adversarial force range (peak 25N) so the loaded task is winnable; identical to the STAND arm.
force_max: 25.0
